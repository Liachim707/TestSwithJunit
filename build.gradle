plugins {
    id 'base'
}

allprojects {
    repositories {
        mavenCentral()
    }
}

// Allows the required command "gradle test" (or "./gradlew test")
// to execute the API tests located in the lib subproject.
tasks.register('test') {
    group = 'verification'
    description = 'Runs all project tests, including the Movies API tests.'
    dependsOn(':lib:test')
}
